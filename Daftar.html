<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Luna Fashion</title>
    <link rel="stylesheet" href="login.css">
    <script src="daftar.js" defer></script>
</head>
<body class="halaman">

    <header>
        <div class="logo">
            <h1>Luna Fashion</h1>
            <p>Tampil Cantik, Percaya Diri</p>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" class="active">Login / Daftar</a>
            <a href="produk.html">Produk</a>
            <a href="kontak.html">Kontak</a>
            <a href="putri.html">Tentang</a>
            <a href="pemesanan.html">Pemesanan</a>
        </nav>
    </header>

    <main class="kotak">
        <h2>Buat akun baru</h2>
        <p>Daftar sekarang dan temukan gaya favoritmu <br>
            Silahkan isi data diri kamu</p>
        <form id="formDaftar">
            <label>Nama Lengkap</label>
            <input type="text" id="nama" required>

            <br><br>

            <label>E-mail</label>
            <input type="email" id="email" required>

            <br><br>

            <label>Kata Sandi</label>
            <input type="password" id="password" required>

            <br><br>

            <label>Konfirmasi Kata Sandi</label>
            <input type="password" id="konfirmasi" required>

            <br><br>

            <button type="submit">Daftar</button>
        </form>

        <p>Sudah punya akun?
            <a href="login.html">Login disini</a>
        </p>
    </main>
</body>
</html>
